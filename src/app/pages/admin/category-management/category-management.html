<div *ngIf="loading" class="fixed inset-0 bg-black bg-opacity-40 z-50 flex justify-center items-center">
  <span class="loading loading-spinner loading-lg text-white"></span>
</div>

<div *ngIf="!loading" class="p-6 space-y-4">
  <div class="flex justify-between items-center">
    <h2 class="text-xl font-bold">Categories</h2>
    <a class="btn btn-sm btn-primary" [routerLink]="['/admin/categories/create']">Add Category</a>
  </div>
  <table class="table w-full">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let cat of paginated">
      <td>{{ cat.id }}</td>
      <td>{{ cat.name }}</td>
      <td class="space-x-2">
        <button class="btn btn-xs btn-outline" [routerLink]="['/admin/categories', cat.id, 'edit']">Edit</button>
        <button class="btn btn-xs btn-error" (click)="deleteCategory(cat.id)">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="flex justify-center space-x-2 mt-4">
    <button class="btn btn-sm" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Prev</button>
    <span>Page {{ currentPage }} of {{ totalPages }}</span>
    <button class="btn btn-sm" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
  </div>
</div>
