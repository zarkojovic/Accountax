<div *ngIf="loading" class="fixed inset-0 bg-black bg-opacity-40 z-50 flex justify-center items-center">
  <span class="loading loading-spinner loading-lg text-white"></span>
</div>

<div *ngIf="!loading" class="p-6 space-y-6">
  <h2 class="text-2xl font-bold">Admin Dashboard</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="stat bg-base-100 shadow">
      <div class="stat-title">Total Invoices</div>
      <div class="stat-value text-primary">{{ stats.totalInvoices }}</div>
    </div>

    <div class="stat bg-base-100 shadow">
      <div class="stat-title">Total Users</div>
      <div class="stat-value text-secondary">{{ stats.totalUsers }}</div>
    </div>

    <div class="stat bg-base-100 shadow">
      <div class="stat-title">Total Categories</div>
      <div class="stat-value text-accent">{{ stats.totalCategories }}</div>
    </div>

    <div class="stat bg-base-100 shadow">
      <div class="stat-title">Total Income</div>
      <div class="stat-value text-success">{{ stats.totalIncome | currency:'EUR' }}</div>
    </div>

    <div class="stat bg-base-100 shadow">
      <div class="stat-title">Total Expenses</div>
      <div class="stat-value text-error">{{ stats.totalExpenses | currency:'EUR' }}</div>
    </div>
  </div>

  <div class="mt-8">
    <h3 class="text-lg font-semibold mb-2">Analytics (Coming Soon)</h3>
    <div class="bg-base-200 p-6 rounded-lg text-center text-sm text-gray-500">
      <app-admin-chart/>
    </div>
  </div>
</div>
