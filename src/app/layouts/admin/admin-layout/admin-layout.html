<div class="drawer lg:drawer-open h-screen bg-cyan-50">
  <input id="sidebar-toggle" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col">
    <!-- Navbar for mobile -->
    <div class="lg:hidden flex items-center justify-between p-4 bg-base-100 shadow-md">
      <label for="sidebar-toggle" class="btn btn-sm btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </label>
      <span class="text-lg font-bold text-cyan-900">AccounTax</span>
    </div>

    <!-- Main Content -->
    <main class="flex-1 p-4 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Sidebar -->
  <div class="drawer-side">
    <label for="sidebar-toggle" class="drawer-overlay"></label>
    <aside class="w-64 bg-white shadow-md p-4 h-full">
      <h2 class="text-xl font-bold text-cyan-900 mb-2">
        Admin Panel
        <img src="/logo-accountax.png" alt="logo" class="inline h-10 ml-2" />
      </h2>
      <hr class="text-gray-300" />
      <ul class="menu w-full">
        <li>
          <a [routerLink]="'/admin/dashboard'" routerLinkActive="text-cyan-700 font-bold bg-cyan-100">Dashboard</a>
        </li>
        <li>
          <a [routerLink]="'/admin/users'" routerLinkActive="text-cyan-700 font-bold bg-cyan-100">Users</a>
        </li>
        <li>
          <a [routerLink]="'/admin/invoices'" routerLinkActive="text-cyan-700 font-bold bg-cyan-100">Invoices</a>
        </li>
        <li>
          <a [routerLink]="'/admin/categories'" routerLinkActive="text-cyan-700 font-bold bg-cyan-100">Categories</a>
        </li>
        <li>
          <a [routerLink]="'/'">Go to Home</a>
        </li>
      </ul>
    </aside>
  </div>
</div>
